<body>
<div id="app"></div>

<script type="module">
/* ============================================================
   ① Firebase 설정 — Firebase 콘솔에서 복사한 값으로 바꿔 넣으세요.
   databaseURL이 비어 있으면 '데모 모드'로 동작합니다.
   (데모 모드: 이 기기의 이 브라우저 안에서만 동작. 탭 여러 개로 테스트용)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "telepathy-cc59d.firebaseapp.com",
  databaseURL: "https://telepathy-cc59d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "telepathy-cc59d",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
/* ============================================================ */

const DEMO = !FIREBASE_CONFIG.databaseURL;  // 데이터베이스 주소가 비어 있으면 데모 모드
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const params = new URLSearchParams(location.search);
let CODE = (params.get('g') || '').toUpperCase() || null;
const SETUP = params.has('setup');
const store = DEMO ? sessionStorage : localStorage;   // 데모: 탭마다 다른 사람
let DB = null, G = null, me = null, unsub = null;
const ui = { sel: null, changing: false, lastIdx: -1, timeKey: '' };

const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mmss = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const linkify = t => {
  const urls = []; const txt = String(t ?? '').replace(/https?:\/\/[^\s]+/g, u => { urls.push(u); return ''; }).replace(/\[네이버지도\]/g, '').replace(/\s+/g, ' ').trim();
  return (txt ? `"${esc(txt)}"` : '') + urls.map(u => ` <a class="maplink" style="display:inline-block;margin:4px 0" href="${esc(u)}" target="_blank" rel="noopener">📍 지도 열기</a>`).join('');
};
const fancy = t => esc(t).replace(/윤지유경데이/g, '윤<span class="sm">지</span>유<span class="sm">경</span>데이');
const norm = s => String(s ?? '').replace(/\s+/g, '').toLowerCase();

/* ---------------- DB 어댑터 ---------------- */
function mockDB() {
  const KEY = 'telepathy-demo-db';
  const ch = 'BroadcastChannel' in window ? new BroadcastChannel('telepathy-demo') : null;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  let tree = load();
  const listeners = new Set();
  const parts = p => p.split('/').filter(Boolean);
  const getAt = p => { let n = tree; for (const k of parts(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : n; };
  const setAt = (p, v) => {
    const ks = parts(p); let n = tree;
    for (let i = 0; i < ks.length - 1; i++) { if (n[ks[i]] == null || typeof n[ks[i]] !== 'object') n[ks[i]] = {}; n = n[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete n[last]; else n[last] = clone(v);
  };
  const fire = () => { for (const l of listeners) l.cb(clone(getAt(l.path))); };
  const save = () => { localStorage.setItem(KEY, JSON.stringify(tree)); ch && ch.postMessage(1); fire(); };
  const reload = () => { tree = load(); fire(); };
  if (ch) ch.onmessage = reload;
  window.addEventListener('storage', e => { if (e.key === KEY) reload(); });
  return {
    get: async p => { tree = load(); return clone(getAt(p)); },
    set: async (p, v) => { tree = load(); setAt(p, v); save(); },
    update: async (p, o) => { tree = load(); for (const k in o) setAt(p + '/' + k, o[k]); save(); },
    on: (p, cb) => { const l = { path: p, cb }; listeners.add(l); cb(clone(getAt(p))); return () => listeners.delete(l); },
    txn: async (p, fn) => { tree = load(); const nv = fn(clone(getAt(p))); if (nv === undefined) return { committed: false }; setAt(p, nv); save(); return { committed: true }; }
  };
}
function withTimeout(pr, ms = 10000) {
  return Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT')), ms))]);
}
async function fbDB() {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const d = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
  const cfg = Object.fromEntries(Object.entries(FIREBASE_CONFIG).filter(([, v]) => v));
  const db = d.getDatabase(initializeApp(cfg));
  return {
    get: async p => (await withTimeout(d.get(d.ref(db, p)))).val(),
    set: (p, v) => withTimeout(d.set(d.ref(db, p), v)),
    update: (p, o) => withTimeout(d.update(d.ref(db, p), o)),
    on: (p, cb) => d.onValue(d.ref(db, p), s => cb(s.val()), e => showError(e)),
    txn: (p, fn) => withTimeout(d.runTransaction(d.ref(db, p), fn))
  };
}
const gp = sub => `games/${CODE}${sub ? '/' + sub : ''}`;

/* ---------------- 오류 안내 ---------------- */
function explain(e) {
  const m = String((e && (e.code || e.message)) || e);
  if (m.includes('NO_DB_URL')) return ['databaseURL이 비어 있어요', 'index.html 맨 위 FIREBASE_CONFIG에 databaseURL 값을 넣어주세요. Firebase 콘솔 → Realtime Database 화면 맨 위에 있는 https://…firebasedatabase.app 주소예요.'];
  if (/permission/i.test(m)) return ['Firebase가 접근을 막고 있어요', 'Realtime Database → 규칙(Rules) 탭에서 ".read"와 ".write"를 true로 바꾸고 게시해 주세요. (테스트 모드 30일이 지났을 수도 있어요)'];
  if (m.includes('TIMEOUT')) return ['Firebase가 응답하지 않아요', '① databaseURL이 정확한지 ② Realtime Database를 실제로 만들었는지(Firestore 아님) ③ 인터넷 연결을 확인해 주세요.'];
  if (/Failed to fetch|import|module/i.test(m)) return ['Firebase 프로그램을 불러오지 못했어요', '인터넷 연결을 확인하고, 파일을 카카오톡 미리보기가 아닌 크롬·사파리에서 열어주세요.'];
  return ['오류가 생겼어요', m];
}
function showError(e) {
  const [t, d] = explain(e);
  $app.innerHTML = `${demoBar()}<div class="card" style="margin-top:40px"><h3>⚠️ ${esc(t)}</h3><p>${esc(d)}</p>
    <p class="note">오류 원문: ${esc(String((e && (e.code || e.message)) || e))}</p>
    <button class="btn sec" onclick="location.reload()">다시 시도</button><a class="btn sec" href="?">처음으로</a></div>`;
}
window.addEventListener('unhandledrejection', ev => showError(ev.reason));

/* ---------------- 기본 설정값 ---------------- */
const DEFAULTS = {
  title: '윤지유경데이 텔레파시 특집',
  players: ['', '', '', '', '', '', '', ''],
  cafes: [
    { name: '세컨브레스', desc: '서울 서초구 양재천로 95-2 1층', url: 'https://naver.me/xaTMWCZh' },
    { name: '모센트 양재점', desc: '서울 서초구 양재천로29길 21 1층 102호', url: 'https://naver.me/5Z1tFOz9' },
    { name: '카페모호', desc: '서울 서초구 양재천로7길 1 1층', url: 'https://naver.me/xOND7v1n' }
  ],
  spots: [
    { name: '영동1교 북단', desc: '다리 위 카페거리 쪽 끝' },
    { name: '영동1교 아래', desc: '다리 밑 인라인스케이트장 쪽' },
    { name: '살롱드가든', desc: '영동1교~2교 사이 정원 데크길' },
    { name: '영동2교 아래 쉼터', desc: '다리 밑 미디어아트 쉼터' }
  ],
  updown: { answer: 79, min: 50, max: 100, tries: 5 },
  addressPrefix: '서울 서초구 언남길 ',
  restaurant: { name: '', address: '서울 서초구 언남길 79' },
  times: { r1Move: 10, r2Limit: 30 },
  r2Range: '세 카페(세컨브레스·모센트 양재점·카페모호)가 있는 구간의 양재천길',
  r2Fallback: '',
  revealAt: '',
  adminPin: ''
};

/* ---------------- 시작 ---------------- */
async function boot() {
  $app.innerHTML = `<p class="center sub" style="margin-top:80px">연결 중…</p>`;
  try { DB = DEMO ? mockDB() : await fbDB(); }
  catch (e) { showError(e); return; }
  $app.addEventListener('click', onClick);
  $app.addEventListener('change', e => { if (e.target.id === 's_count') onSetupCount(); });
  $modal.addEventListener('click', onClick);
  if (!CODE) return renderHome();
  if (SETUP) {
    if (CODE === 'NEW') return renderSetup(null);
    $app.innerHTML = `<p class="center sub" style="margin-top:80px">불러오는 중…</p>`;
    try { return renderSetup(await DB.get(gp('config'))); } catch (e) { return showError(e); }
  }
  me = store.getItem('tp_me_' + CODE);
  $app.innerHTML = `<p class="center sub" style="margin-top:80px">불러오는 중…</p>`;
  let loaded = false;
  setTimeout(() => { if (!loaded) showError(new Error('TIMEOUT')); }, 12000);
  unsub = DB.on(gp(), v => { loaded = true; G = v; render(); autoAdvance(); });
  setInterval(tick, 1000);
}

/* ---------------- 공통 계산 ---------------- */
const C = () => G.config;
const S = () => G.state || { round: 0, phase: 'lobby' };
const pname = id => (C().players.find(p => p.id === id) || {}).name || '?';
const allIds = () => C().players.map(p => p.id);
const staffIds = () => [C().quizmaster, C().host].filter(Boolean);
const isStaff = id => staffIds().includes(id);
const scoreIds = () => allIds().filter(id => !isStaff(id));
const activeIds = r => r === 3 ? scoreIds() : allIds();
const isAdmin = () => store.getItem('tp_admin_' + CODE) === '1';
const rd = r => (G['r' + r] || {});
const groupOf = id => (S().groups || []).find(g => g.includes(id)) || [];
const reached = r => { const s = S(); return s.round > r || (s.round === r && ['reveal', 'quiz', 'done'].includes(s.phase)); };
function majority(vals) {
  const cnt = {}; vals.forEach(v => { if (v != null) cnt[v] = (cnt[v] || 0) + 1; });
  let best = null, bc = -1; Object.keys(cnt).forEach(k => { if (cnt[k] > bc) { bc = cnt[k]; best = +k; } });
  return best;
}
function loneIds() {
  if (S().plan && S().plan.mode !== 'choose') return [];
  const r1 = G.r1 || {}, cnt = {}; allIds().forEach(id => { const c = r1[id] && r1[id].cur; if (c != null) cnt[c] = (cnt[c] || 0) + 1; });
  return allIds().filter(id => r1[id] && r1[id].cur != null && cnt[r1[id].cur] === 1);
}
function finalCafe(id) { const d = (G.r1 || {})[id], pm = (S().plan && S().plan.moves) || {}; if (pm[id] != null) return pm[id]; return d ? (d.moved != null ? d.moved : d.cur) : null; }
function makePlan() {
  // 2라운드 팀이 항상 2팀 이상, 팀마다 2명 이상이 되도록 정리
  const r1 = G.r1 || {}, ids = allIds().filter(id => r1[id] && r1[id].cur != null), nC = C().cafes.length;
  const by = {}; ids.forEach(id => (by[r1[id].cur] = by[r1[id].cur] || []).push(id));
  const solid = Object.keys(by).map(Number).filter(c => by[c].length >= 2), lone = Object.keys(by).map(Number).filter(c => by[c].length === 1);
  const moves = {};
  if (solid.length >= 2 || ids.length < 4) return { mode: 'choose', moves };
  if (solid.length === 1 && lone.length >= 2) { const meet = shuffle(lone)[0]; lone.forEach(c => { if (c !== meet) moves[by[c][0]] = meet; }); return { mode: 'loneTeam', meet, moves }; }
  if (solid.length === 1 && lone.length === 1) { const big = shuffle(by[solid[0]]), need = Math.floor(ids.length / 2) - 1; big.slice(0, need).forEach(id => moves[id] = lone[0]); return { mode: 'split', moves }; }
  if (solid.length === 1 && lone.length === 0 && by[solid[0]].length === allIds().length) return { mode: 'allTogether', moves };
  if (solid.length === 1 && lone.length === 0) { const c0 = solid[0], other = shuffle([...Array(nC).keys()].filter(c => c !== c0))[0]; shuffle(by[c0]).slice(0, Math.floor(ids.length / 2)).forEach(id => moves[id] = other); return { mode: 'split', moves }; }
  return { mode: 'choose', moves };
}
function moveOptions(id) {
  const r1 = G.r1 || {}, mine = r1[id].cur, lone = loneIds();
  const others = C().cafes.map((_, i) => i).filter(i => i !== mine);

function calcScores() {
  const ids = allIds(), s = S(), sc = {};
  ids.forEach(id => sc[id] = { r1: 0, r2: 0, r3: 0, notes: [] });
  if (reached(1)) {
    const r1 = rd(1), hero = s.hero, hc = r1[hero] ? r1[hero].cur : null;
    ids.forEach(id => { if (id === hero || !r1[id]) return; if (hc != null && r1[id].cur === hc) sc[id].r1 += 2; sc[id].r1 -= (r1[id].changes || 0); });

    const cnt = {}; ids.forEach(id => { const c = r1[id] && r1[id].cur; if (c != null) cnt[c] = (cnt[c] || 0) + 1; });
    ids.forEach(id => { const c = r1[id] && r1[id].cur; if (c != null && cnt[c] === 1) sc[id].notes.push('🐺 외로운 늑대'); });

    const first = Object.entries(links).sort((a, b) => a[1] - b[1])[0];

}

/* ---------------- 자동 진행 (사회자 대신) ---------------- */
function nextState(cur) {
  if (!cur) return undefined;
  const ids = allIds(), base = { ...cur, at: now() }; delete base.ready;
  if (cur.phase === 'lobby') return { ...base, round: 1, phase: 'choose', hero: shuffle(ids.filter(id => !isStaff(id)).length ? ids.filter(id => !isStaff(id)) : ids)[0] };
  if (cur.phase === 'choose') return { ...base, phase: 'move', moveAt: now() };
  if (cur.phase === 'move' && cur.round === 2) return { ...base, phase: 'reveal', r2DoneAt: now() };
  if (cur.phase === 'move') return cur.round === 1 ? { ...base, phase: 'reveal', plan: makePlan() } : { ...base, phase: 'reveal' };
  if (cur.phase === 'reveal') {
    if (cur.round === 1 && cur.plan && cur.plan.mode === 'allTogether') return { ...base, round: 3, phase: 'quiz', r2Skipped: true };
    if (cur.round === 1) {
      const r1 = G.r1 || {}, groups = [], cafes = [];
      C().cafes.forEach((_, ci) => { const m = ids.filter(id => finalCafe(id) === ci); if (m.length) { groups.push(m); cafes.push(ci); } });
      const lost = ids.filter(id => !(r1[id] && r1[id].cur != null));
      if (lost.length) { if (groups.length) groups[groups.length - 1].push(...lost); else { groups.push(lost); cafes.push(-1); } }
      const used = new Set(); const codes = groups.map(() => { let c; do { c = String(Math.floor(1000 + Math.random() * 9000)); } while (used.has(c)); used.add(c); return c; });
      return { ...base, round: 2, phase: 'choose', groups, teamCafe: cafes, teamCodes: codes };
    }

let advancing = false;
async function autoAdvance() {
  if (!G || !G.config || advancing) return;
  const s = S(), r = s.round, ph = s.phase, act = activeIds(r || 1);
  let go = false;
  if (ph === 'lobby' || ph === 'reveal') go = act.every(id => s.ready && s.ready[id]) && !(r === 1 && ph === 'reveal' && loneIds().some(id => (G.r1 || {})[id].moved == null));
  else if (ph === 'choose') {
    if (r === 2) go = false; // 방장이 시작
    else go = act.every(id => rd(r)[id] && rd(r)[id].first != null);
  }
  else if (ph === 'move') {
    if (r === 2) go = (s.groups || []).length > 0 && r2Clusters().list.length === 1;
    else go = act.every(id => rd(r)[id] && rd(r)[id].arrived);
  }
  else if (ph === 'quiz') {
    const q = G.quiz || {}; const ra = revealAtTs();
    go = activeIds(3).every(id => udState(id).over) || (ra && now() >= ra);
  }
  if (go) { advancing = true; try { await advance(r, ph); } finally { advancing = false; } }
}

/* ----- 점수 ----- */
function scoreTable(key) {
  const sc = calcScores(); const ids = scoreIds().sort((a, b) => (key ? sc[b][key] - sc[a][key] : sc[b].total - sc[a].total));
  return `<table class="sb"><tr><th style="text-align:left">이름</th><th>1R</th><th>2R</th><th>3R</th><th>합계</th></tr>
    ${ids.map(id => `<tr><td class="nm">${esc(pname(id))}<div class="note">${sc[id].notes.join(' ')}</div></td><td>${sc[id].r1}</td><td>${sc[id].r2}</td><td>${sc[id].r3}</td><td class="tot">${sc[id].total}</td></tr>`).join('')}</table>
    ${staffIds().length ? `<p class="note" style="margin-top:8px">진행(점수 제외): ${staffIds().map(id => esc(pname(id))).join(', ')}</p>` : ''}`;
}
function scoreMini(key) { return `<div class="card"><h3>점수판</h3>${scoreTable(key)}</div>`; }
function finalBoard() {
  const sc = calcScores();
  const solvedAt = id => { const d = udState(id); return d.won ? Math.max(...d.gs.map(g => g.at)) : Infinity; };
  const cmp = (a, b) => (sc[b].total - sc[a].total) || (sc[b].r3 - sc[a].r3) || (solvedAt(a) - solvedAt(b));
  const pool = scoreIds().sort(cmp);
  if (!pool.length) return '';
  const top = sc[pool[0]].total, tied = pool.filter(id => sc[id].total === top);
  const kings = pool.filter(id => cmp(id, pool[0]) === 0);
  const why = tied.length > 1 ? (kings.length < tied.length ? `<p class="note" style="color:inherit">${tied.length}명이 ${top}점 동점! 3라운드 업다운을 더 적게, 더 빨리 맞힌 사람이 1등이에요.</p>` : '') : '';
  return `<div class="banner"><div class="kicker">최종 결과 · ${top}점</div><h2>👑 1등<br>${kings.map(id => esc(pname(id))).join(', ')}</h2>
    <p>🎁 선물의 주인공! 축하해요 🎉</p>${why}</div>
    <div class="card">${scoreTable()}</div>`;
}

  <div class="card"><h3>1R ☕ 카페 후보 3곳</h3>${listRows('cafes', c.cafes, '카페 이름')}
    <label class="fl">권장 이동 시간 (분)</label><input id="s_r1" type="number" value="${c.times.r1Move}"></div>
  <div class="card"><h3>2R 🧭 다 모이기</h3><p class="sub">방장이 시작을 누르면 범위 안에서 힌트 없이 모든 팀이 만나야 해요.</p>
    <label class="fl">범위 (참가자 화면에 그대로 보여요)</label><textarea id="s_range" rows="2">${esc(c.r2Range || '')}</textarea>
    <label class="fl">제한 시간 (분)</label><input id="s_lim" type="number" value="${c.times.r2Limit || 30}">
    <label class="fl">시간 초과 시 최종 집결지 (선택)</label><input id="s_fb" value="${esc(c.r2Fallback || '')}" placeholder="예: 영동1교 북단"></div>
  <div class="card"><h3>3R 업다운 주소 퀴즈</h3><p class="sub">주소 앞부분은 처음부터 보이고, 번지수만 업다운으로 맞혀요.</p>
    <label class="fl">주소 앞부분 (처음부터 보임)</label><input id="s_pre" value="${esc(c.addressPrefix)}">
    <div class="row"><div><label class="fl">정답 번지수</label><input id="s_ans" type="number" value="${(c.updown || DEFAULTS.updown).answer}"></div>
      <div><label class="fl">기회</label><input id="s_tries" type="number" value="${(c.updown || DEFAULTS.updown).tries}"></div></div>
    <div class="row"><div><label class="fl">최소</label><input id="s_min" type="number" value="${(c.updown || DEFAULTS.updown).min}"></div>
      <div><label class="fl">최대</label><input id="s_max" type="number" value="${(c.updown || DEFAULTS.updown).max}"></div></div>
    <label class="fl">식당 이름 (마지막에 공개)</label><input id="s_rn" value="${esc(c.restaurant.name)}">
    <label class="fl">식당 전체 주소 (지도 링크용)</label><input id="s_ra" value="${esc(c.restaurant.address)}" placeholder="예: 서울 강남구 논현로 12">
    <label class="fl">자동 공개 시각 (선택, 예약 20분 전 추천)</label><input id="s_at" value="${esc(c.revealAt)}" placeholder="예: 18:40"></div>
  <button class="btn" data-act="saveSetup">${existing ? '저장하기' : '게임 만들기'}</button>
  ${existing ? `<a class="btn sec" href="?g=${CODE}">돌아가기</a>` : ''}
  </div>`;
  window.__existing = existing;
}
async function saveSetup() {
  const ex = window.__existing;
  const val = id => document.getElementById(id).value.trim();
  const names = [...document.querySelectorAll('[data-k="players"]')].map(i => i.value.trim());
  const named = names.map((n, i) => ({ n, i })).filter(x => x.n);
  if (named.length < 2) return toast('참가자를 2명 이상 적어주세요');
  if (!val('s_pin')) return toast('방장 비밀번호를 정해주세요');
  const players = named.map(x => ({ id: (ex && ex.players[x.i]) ? ex.players[x.i].id : 'p' + x.i, name: x.n }));
  const qmN = parseInt(val('s_qm'), 10) - 1; const qmP = named.find(x => x.i === qmN);
  const hoN = parseInt(val('s_host'), 10) - 1; const hoP = hoN >= 0 ? named.find(x => x.i === hoN) : null;
  if (hoN >= 0 && !hoP) return toast('진행자 번호에 해당하는 이름이 없어요');
  if (hoP && hoP === qmP) return toast('진행자는 방장과 다른 사람으로 정해주세요');
  if (!qmP) return toast('출제자 번호에 해당하는 이름이 없어요');
  const pairs = key => { const q = f => [...document.querySelectorAll(`[data-k="${key}"][data-f="${f}"]`)]; const ns = q('name'), ds = q('desc'), us = q('url'); return ns.map((n, i) => ({ name: n.value.trim(), desc: ds[i].value.trim(), url: us[i].value.trim() })).filter(o => o.name); };
  const updown = { answer: +val('s_ans'), min: +val('s_min') || 1, max: +val('s_max') || 100, tries: +val('s_tries') || 3 };
  if (!(updown.answer >= updown.min && updown.answer <= updown.max)) return toast('정답 번지수가 최소~최대 범위 안에 있어야 해요');
  const cfg = {
    title: val('s_title') || '텔레파시 특집', adminPin: val('s_pin'), players, quizmaster: players[named.indexOf(qmP)].id, host: hoP ? players[named.indexOf(hoP)].id : '',
    cafes: pairs('cafes'), r2Range: val('s_range'), r2Fallback: val('s_fb'),
    updown, addressPrefix: document.getElementById('s_pre').value, restaurant: { name: val('s_rn'), address: val('s_ra') },
    times: { r1Move: +val('s_r1') || 10, r2Limit: +val('s_lim') || 30 }, revealAt: val('s_at')
  };
  if (cfg.cafes.length < 2) return toast('장소는 라운드마다 2곳 이상 필요해요');
  if (ex) { await DB.set(gp('config'), cfg); location.href = '?g=' + CODE; return; }
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let code;
  for (let t = 0; t < 10; t++) { code = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''); if (!(await DB.get('games/' + code + '/config'))) break; }
  CODE = code;
  await DB.set(gp(), { config: cfg, state: { round: 0, phase: 'lobby' } });
  store.setItem('tp_admin_' + CODE, '1');
  const link = location.origin + location.pathname + '?g=' + CODE;
  $app.innerHTML = `${demoBar()}<div style="padding-top:40px"><div class="banner green"><div class="kicker">게임 생성 완료</div><h1 class="big" style="letter-spacing:6px">${CODE}</h1><p>게임 코드</p></div>
    <div class="card"><p class="sub" style="margin:0">친구들에게 이 링크를 보내세요</p><p style="word-break:break-all"><b>${esc(link)}</b></p>
    <button class="btn sec" data-act="copy" data-t="${esc(link)}">링크 복사</button></div>
    <a class="btn" href="?g=${CODE}">나도 입장하기</a></div>`;
}

/* ---------------- 클릭 처리 ---------------- */
async function onClick(e) {
  if (e.target.closest('a.maplink')) return;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'bgclose') { if (e.target === b) closeModal(); return; }
  const s = G ? S() : null, r = s ? s.round : 0;
  switch (act) {
    case 'newGame': location.href = '?g=NEW&setup=1'; break;
    case 'joinCode': { const v = document.getElementById('joincode').value.trim().toUpperCase(); if (v) location.href = '?g=' + v; break; }
    case 'join': {
      const id = b.dataset.id; const pl = (G.players || {})[id];
      me = id; store.setItem('tp_me_' + CODE, id);
      if (!pl || !pl.code) {
        const used = Object.values(G.players || {}).map(p => p.code); let code;
        do { code = String(Math.floor(1000 + Math.random() * 9000)); } while (used.includes(code));
        await DB.update(gp('players/' + id), { joined: now(), code });
      } else render();
      break;
    }
    case 'sel': ui.sel = +b.dataset.i; render(); break;
    case 'lock': if (ui.sel == null) return; await DB.set(gp(`r${r}/${me}`), { first: ui.sel, cur: ui.sel, changes: 0, at: now() }); ui.sel = null; break;
    case 'startChange': ui.changing = true; ui.sel = null; render(); break;
    case 'cancelChange': ui.changing = false; ui.sel = null; render(); break;
    case 'change': {
      const my = rd(r)[me]; if (ui.sel == null || ui.sel === my.cur) { ui.changing = false; render(); return; }
      const upd = { cur: ui.sel }; if (r === 1) upd.changes = (my.changes || 0) + 1;
      ui.changing = false; ui.sel = null; await DB.update(gp(`r${r}/${me}`), upd); break;
    }
    case 'arrive': await DB.update(gp(`r${r}/${me}`), { arrived: now() }); break;
    case 'teamLoc': {
      const inp = document.getElementById('locText'), v = (inp.value || '').trim(); if (!v) return toast('위치를 적어주세요');
      const ti = S().groups.indexOf(groupOf(me)); inp.value = '';
      await DB.set(gp('r2loc/' + ti), { text: v, by: me, at: now() }); toast('위치를 보냈어요 📍'); break;
    }
    case 'loneMove': {
      const opts = moveOptions(me); if (ui.sel == null || !opts.includes(ui.sel)) return;
      const sel = ui.sel; ui.sel = null; await DB.update(gp('r1/' + me), { moved: sel }); toast('합류할 카페로 이동하세요!'); break;
    }
    case 'startR2': if (!isAdmin()) return; await advance(2, 'choose'); toast('2라운드 시작! 30분'); break;
    case 'teamLink': {
      const inp = document.getElementById('teamcode'), v = (inp.value || '').trim(); if (!v) return;
      const codes = S().teamCodes || [], other = codes.indexOf(v), ti = S().groups.indexOf(groupOf(me));
      if (other < 0) return toast('없는 팀 코드예요');
      if (other === ti) return toast('우리 팀 코드예요 😅');
      const { root } = r2Clusters(); if (root(other) === root(ti)) return toast('이미 함께 있는 팀이에요');
      inp.value = ''; const k = Math.min(ti, other) + '_' + Math.max(ti, other);
      await DB.update(gp('r2links'), { [k]: now() }); toast(`${teamName(other)}과 만났어요! 🎉`); break;
    }
    case 'ready': await DB.set(gp(`state/ready/${me}`), (s.ready && s.ready[me]) ? null : true); break;
    case 'qSubmit': {
      const inp = document.getElementById('qans'), n = parseInt(inp.value, 10), u = UD();
      if (!(n >= u.min && n <= u.max)) return toast(`${u.min}~${u.max} 사이 숫자를 입력하세요`);
      const d = udState(me); if (d.over) return; inp.value = '';
      await DB.txn(gp('quiz/guesses/' + me), cur => {
        const gs = Object.values(cur || {});
        if (gs.length !== d.used || gs.length >= u.tries || gs.some(g => g.n === u.answer)) return undefined;
        return { ...(cur || {}), ['g' + gs.length]: { n, at: Date.now() } };
      });
      toast(n === u.answer ? '🎯 정답!' : n < u.answer ? '⬆ UP!' : '⬇ DOWN!');
      break;
    }
    case 'scores': openModal(`<h2>점수판</h2>${scoreTable()}<p class="note" style="margin-top:10px">1R 주인공 카페 맞힘 +2 · 주인공은 맞힌 1명당 +1 · 목적지 변경 -1<br>2R 제한 시간 안에 모두 만나면 +3 · 가장 먼저 만난 두 팀 +1<br>3R 업다운: 1번 만에 맞히면 5점, 2번 4점 … 5번째 1점, 실패 0점<br>방장·진행자는 점수 제외 · 1등에게 선물 🎁<br>동점이면 3R 점수 → 3R을 더 빨리 맞힌 사람 순</p><button class="btn sec" data-act="close">닫기</button>`); break;
    case 'admin': openModal(adminModal()); break;
    case 'pin': { const v = document.getElementById('pin').value; if (v === C().adminPin) { store.setItem('tp_admin_' + CODE, '1'); openModal(adminModal()); } else toast('비밀번호가 달라요'); break; }
    case 'force': closeModal(); await advance(s.round, s.phase); toast('다음 단계로!'); break;
    case 'forceReveal': closeModal(); await advance(3, 'quiz'); break;
    case 'reset':
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '정말 처음부터? 한 번 더 누르세요'; return; }
      closeModal(); await DB.update(gp(), { state: { round: 0, phase: 'lobby' }, r1: null, r2loc: null, r2links: null, quiz: null }); break;
    case 'close': closeModal(); break;
    case 'copy': try { await navigator.clipboard.writeText(b.dataset.t); toast('복사했어요'); } catch (er) { toast('길게 눌러 직접 복사해 주세요'); } break;
    case 'addQ': document.getElementById('quizlist').insertAdjacentHTML('beforeend', window.__quizRow({ q: '', a: '', piece: '', hint: '' }, document.querySelectorAll('[data-quiz]').length)); break;
    case 'delQ': b.closest('[data-quiz]').remove(); break;
    case 'saveSetup': b.disabled = true; b.textContent = '저장 중…'; try { await saveSetup(); } catch (er) { showError(er); } finally { b.disabled = false; b.textContent = '다시 저장하기'; } break;
  }
}

/* ---------------- 타이머 ---------------- */
function timeKey() {
  if (!G || !G.config) return '';
  const s = S(), T = C().times; const el = now() - (s.moveAt || now());
  const q = G.quiz || {};
  return [s.phase === 'move' && s.round === 2 ? String(el >= (T.r2Limit || 30) * 60000) : '', (q.lockUntil || 0) > now()].join('|');
}
function tick() {
  document.querySelectorAll('[data-since]').forEach(el => el.textContent = mmss(now() - (+el.dataset.since)));
  document.querySelectorAll('[data-until]').forEach(el => el.textContent = mmss((+el.dataset.until) - now()));
  if (G && G.config && me && timeKey() !== ui.timeKey) render();
  if (G && S().phase === 'quiz') autoAdvance();
}

boot();
</script>
